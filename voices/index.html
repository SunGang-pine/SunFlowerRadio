<main>
  <section class="hero">
    <div class="eyebrow"><span></span> LISTEN FIRST</div>
    <h1>先听听声音，<br>再决定今晚谁上班。</h1>
    <p>这里是 SunFlowerRadio 的全部 Edge 神经语音。点每张卡片里的播放键试听，再到制作台里选同一个音色生成节目。</p>
    <div class="filters" id="filters">
      <button class="on" data-lang="all">全部 <small>11</small></button>
      <button data-lang="zh">中文 <small>5</small></button>
      <button data-lang="ja">日本語 <small>2</small></button>
      <button data-lang="en">English <small>4</small></button>
    </div>
  </section>

  <div class="grid" id="grid"></div>

  <section class="note">
    <b>离线备用</b>
    <p>Windows SAPI（Haruka / Zira / Huihui）仍然保留。Edge 网络不可用时会自动回退，但音质就是老式合成声。想要稳定好声音，请保持联网。</p>
  </section>
